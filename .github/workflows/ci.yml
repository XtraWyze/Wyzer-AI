name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test on Windows and Python 3.11
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[audio,ui,dev]"

      - name: Run Ruff
        run: python -m ruff check wyzer tests

      - name: Run tests
        run: python -m pytest

      - name: Run MyPy
        run: python -m mypy wyzer tests
